  .brand h1 .letter {
    display: inline-block;
    background-image: linear-gradient(180deg, #f3dfa3 0%, #c9a25d 45%, #8a6a2e 55%, #c9a25d 70%, #f3dfa3 100%),
                       linear-gradient(100deg, transparent 30%, rgba(255,244,214,0.95) 47%, rgba(255,244,214,0.95) 53%, transparent 70%);
    background-blend-mode: normal, screen;
    background-size: 100% 100%, 260% 100%;
    background-position: 0 0, 160% 0;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 18px rgba(0,0,0,0.6);
    opacity: 0;
    transform: translateY(22px) scale(0.85);
    filter: blur(6px);
    animation:
      letterIn 0.7s cubic-bezier(.2,.8,.2,1) calc(5.9s + var(--d, 0s)) forwards,
      shineSweep 4.5s ease-in-out calc(5.9s + var(--d, 0s) + 1.6s) infinite;
  }
  .brand h1 .accent {
    background-image: none;
    color: var(--blood-bright);
    -webkit-text-fill-color: var(--blood-bright);
    text-shadow: 0 0 4px rgba(193,39,45,0.5), 0 0 22px rgba(193,39,45,0.55);
  }
  @keyframes letterIn {
    0% { opacity: 0; transform: translateY(22px) scale(0.85); filter: blur(6px); }
    60% { opacity: 1; filter: blur(0); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }
  @keyframes shineSweep {
    0%   { background-position: 0 0, 160% 0; }
    35%  { background-position: 0 0, -60% 0; }
    100% { background-position: 0 0, -60% 0; }
  }
  .brand h2 {
    font-family: 'Playfair Display', Georgia, serif;
    font-weight: 700;
    font-size: clamp(20px, 6vw, 28px);
    letter-spacing: 12px;
    margin: 6px 0 0;
    color: #d8c393;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    opacity: 0;
    animation: fadeUp 0.8s ease 6.9s forwards;
  }
  .divider {
    width: 46%;
    margin: 14px auto 12px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    position: relative;
  }
  .divider::after {
    content: "❖";
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: transparent;
    color: var(--gold);
    font-size: 12px;
    padding: 0 8px;
  }
  .tagline {
    font-size: 13.5px;
    letter-spacing: 2.5px;
    color: #cfc3a4;
    margin: 0 0 22px;
    text-transform: uppercase;
    font-style: italic;
  }

  .prompt-label {
    font-size: 12.5px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold-bright);
    margin-bottom: 10px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
  }

  .input-wrap {
    position: relative;
    margin-bottom: 16px;
  }
  .input-wrap svg {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; opacity: 0.75;
  }
  input#nameInput {
    width: 100%;
    padding: 15px 16px 15px 46px;
    background: rgba(15,12,8,0.72);
    border: 1px solid rgba(201,162,93,0.55);
    border-radius: 4px;
    color: #f2e9d3;
    font-size: 16px;
    font-family: Georgia, serif;
    letter-spacing: 0.5px;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  input#nameInput::placeholder { color: #8a7f66; font-style: italic; }
  input#nameInput:focus {
    border-color: var(--gold-bright);
    box-shadow: 0 0 0 3px rgba(201,162,93,0.18), 0 0 18px rgba(201,162,93,0.25);
  }
  input#nameInput.error {
    border-color: var(--blood-bright);
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  .error-msg {
    color: #e08a8a;
    font-size: 12px;
    letter-spacing: 1px;
    height: 16px;
    margin: -6px 0 6px;
    opacity: 0;
    transition: opacity 0.2s;
    font-style: italic;
  }
  .error-msg.show { opacity: 1; }

  button#continueBtn {
    width: 100%;
    padding: 15px;
    background: linear-gradient(180deg, #6e1010 0%, #3d0a0a 55%, #2a0707 100%);
    border: 1px solid var(--gold);
    border-radius: 4px;
    color: #f3e2b8;
    font-size: 15px;
    letter-spacing: 4px;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
    transition: transform 0.12s ease, box-shadow 0.2s;
    font-family: Georgia, serif;
  }
  button#continueBtn:active { transform: scale(0.97); }
  button#continueBtn:hover { box-shadow: 0 6px 22px rgba(139,26,26,0.55), inset 0 1px 0 rgba(255,255,255,0.1); }
  button#continueBtn .arrow { transition: transform 0.2s; }
  button#continueBtn:hover .arrow { transform: translateX(4px); }
  button#continueBtn:disabled { opacity: 0.55; cursor: default; }

  .divider-bottom {
    width: 30%;
    margin: 16px auto 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(201,162,93,0.6), transparent);
    position: relative;
  }
  .divider-bottom::after {
    content: "❖";
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold);
    font-size: 10px;
  }

  /* Welcome overlay after continue */
  #welcome {
    position: absolute; inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, rgba(20,15,8,0.97), rgba(3,2,1,0.99));
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease;
    text-align: center;
    padding: 0 10%;
  }
  #welcome.show { opacity: 1; pointer-events: auto; }
  #welcome .glow {
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 14px;
    opacity: 0;
    animation: fadeUp 0.8s 0.2s forwards;
  }
  #welcome h3 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(26px, 8vw, 36px);
    color: #f3dfa3;
    margin: 0 0 10px;
    opacity: 0;
    animation: fadeUp 0.8s 0.4s forwards;
    text-shadow: 0 0 24px rgba(201,162,93,0.4);
  }
  #welcome p {
    font-size: 13px;
    letter-spacing: 1px;
    color: #b9ac8c;
    font-style: italic;
    opacity: 0;
    animation: fadeUp 0.8s 0.6s forwards;
    line-height: 1.7;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #welcome .spinner {
    margin-top: 26px;
    width: 26px; height: 26px;
    border: 2px solid rgba(201,162,93,0.25);
    border-top-color: var(--gold-bright);
    border-radius: 50%;
    animation: spin 0.9s linear infinite, fadeUp 0.8s 0.7s forwards;
    opacity: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- INTRO SEQUENCE ---------- */
  #intro {
    position: absolute; inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 45%, #14100a 0%, #060503 70%, #020201 100%);
    animation: introOut 0.9s ease 5.0s forwards;
  }
  @keyframes introOut {
    0%   { opacity: 1; }
    100% { opacity: 0; pointer-events: none; }
  }
  .intro-inner {
    position: relative;
    width: 100%;
    text-align: center;
    padding: 0 10%;
  }
  .intro-line {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    transform: translateY(-50%);
    margin: 0;
    opacity: 0;
    font-family: 'Playfair Display', Georgia, serif;
    text-transform: uppercase;
  }
  .intro-line.l1, .intro-line.l2 {
    font-size: clamp(24px, 7.5vw, 34px);
    letter-spacing: 3px;
    color: #e9dcb8;
    font-style: italic;
    text-shadow: 0 2px 14px rgba(0,0,0,0.8);
    animation: introFade 1.7s ease forwards;
  }
  .intro-line.l1 { animation-delay: 0.35s; }
  .intro-line.l2 { animation-delay: 2.05s; }
  .intro-line.l3 {
    font-size: clamp(30px, 9.5vw, 46px);
    font-weight: 900;
    letter-spacing: 3px;
    color: var(--blood-bright);
    text-shadow: 0 0 10px rgba(193,39,45,0.55), 0 0 30px rgba(193,39,45,0.4), 0 2px 14px rgba(0,0,0,0.8);
    animation: introFadeStrong 1.85s ease forwards;
    animation-delay: 3.7s;
  }
  @keyframes introFade {
    0%   { opacity: 0; letter-spacing: 9px; }
    18%  { opacity: 1; letter-spacing: 3px; }
    78%  { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes introFadeStrong {
    0%   { opacity: 0; letter-spacing: 10px; transform: translateY(-50%) scale(0.92); }
    20%  { opacity: 1; letter-spacing: 3px; transform: translateY(-50%) scale(1); }
    40%  { text-shadow: 0 0 10px rgba(193,39,45,0.55), 0 0 30px rgba(193,39,45,0.4), 0 2px 14px rgba(0,0,0,0.8); }
    60%  { text-shadow: 0 0 16px rgba(193,39,45,0.85), 0 0 46px rgba(193,39,45,0.6), 0 2px 14px rgba(0,0,0,0.8); }
    82%  { opacity: 1; text-shadow: 0 0 10px rgba(193,39,45,0.55), 0 0 30px rgba(193,39,45,0.4), 0 2px 14px rgba(0,0,0,0.8); }
    100% { opacity: 0; }
  }
  /* main content waits for the intro to finish before revealing itself */
  .content {
    opacity: 0;
    animation: contentFadeIn 0.9s ease 5.7s forwards;
  }
  @keyframes contentFadeIn {
    0%   { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  #soundToggle {
    position: absolute;
    top: 14px; right: 14px;
    z-index: 60;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(10,8,5,0.55);
    border: 1px solid rgba(201,162,93,0.55);
    color: var(--gold-bright);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(2px);
  }
  #soundToggle svg { width: 20px; height: 20px; display: block; }
  #soundToggle:active { transform: scale(0.92); }
</style>
</head>
<body>

<div id="screen">
  <div id="rain"></div>
  <button id="soundToggle" aria-label="Sesi aç/kapat">
    <svg id="iconSoundOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9v6h4l5 4V5l-5 4H4z" fill="currentColor" stroke="none"/>
      <path d="M16.2 8.3a5 5 0 0 1 0 7.4"/>
      <path d="M18.6 6a8.5 8.5 0 0 1 0 12"/>
    </svg>
    <svg id="iconSoundOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <path d="M4 9v6h4l5 4V5l-5 4H4z" fill="currentColor" stroke="none"/>
      <path d="M16 9l5 6"/>
      <path d="M21 9l-5 6"/>
    </svg>
  </button>

  <div id="intro">
    <div class="intro-inner">
      <p class="intro-line l1">Sen de kimsin?</p>
      <p class="intro-line l2">Yeni misin?</p>
      <p class="intro-line l3">İçeriye gel!</p>
    </div>
  </div>

  <!--
    Background music: put your own audio file next to this HTML file
    (same folder, e.g. /www/mafia_theme.m4a) and it will play automatically.
    Nothing is embedded here — this just points at a local file.
  -->
  <audio id="bgMusic" src="mafia_theme.m4a" loop preload="auto"></audio>

  <div class="content">
    <div class="brand">
      <h1 id="titleH1">
        <span class="letter" style="--d:0.05s">M</span><span class="letter" style="--d:0.15s">A</span><span class="letter" style="--d:0.25s">F</span><span class="letter" style="--d:0.35s">I</span><span class="letter accent" style="--d:0.45s">A</span>
      </h1>
      <h2>IOZ</h2>
    </div>
    <div class="divider"></div>
    <p class="tagline">Bu şehirde herkesin bir sırrı var.</p>

    <div class="prompt-label">Adın ne?</div>
    <div class="input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#c9a25d" stroke-width="1.6"><circle cx="12" cy="8" r="3.2"/><path d="M4.5 20c1-4 4-6 7.5-6s6.5 2 7.5 6"/></svg>
      <input id="nameInput" type="text" placeholder="Adını yaz..." maxlength="18" autocomplete="off" />
    </div>
    <div class="error-msg" id="errorMsg">Bir isim yazmadan bu sokaklarda yürüyemezsin.</div>

    <button id="continueBtn">
      <span>Devam Et</span>
      <span class="arrow">›</span>
    </button>

    <div class="divider-bottom"></div>
  </div>

  <div id="welcome">
    <div class="glow">Hoş geldin</div>
    <h3 id="welcomeName">İsimsiz</h3>
    <p>Boğaz'ın karanlık sokakları<br>seni bekliyor.</p>
    <div class="spinner"></div>
  </div>
</div>

<script>
  const input = document.getElementById('nameInput');
  const btn = document.getElementById('continueBtn');
  const errorMsg = document.getElementById('errorMsg');
  const welcome = document.getElementById('welcome');
  const welcomeName = document.getElementById('welcomeName');

  function tryContinue() {
    const name = input.value.trim();
    if (name.length < 2) {
      input.classList.add('error');
      errorMsg.classList.add('show');
      input.focus();
      setTimeout(() => input.classList.remove('error'), 420);
      return;
    }
    errorMsg.classList.remove('show');
    welcomeName.textContent = name;
    welcome.classList.add('show');

    try {
      window.storage && window.storage.set('player_name', name, false);
    } catch (e) {}
  }

  btn.addEventListener('click', tryContinue);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') tryContinue();
  });
  input.addEventListener('input', () => {
    if (input.value.trim().length >= 2) errorMsg.classList.remove('show');
  });

  // restore previously entered name, if any
  (async () => {
    try {
      if (window.storage) {
        const res = await window.storage.get('player_name', false);
        if (res && res.value) input.value = res.value;
      }
    } catch (e) {}
  })();

  /* ================= MAFIA IOZ — background score =================
     Plays a real audio file the user supplies locally (not embedded here).
     Put your track next to this HTML file, e.g.  /www/mafia_theme.m4a
     Loud by default, loops, simple play/pause — no synth, no crackling.
  */
  const bgMusic = document.getElementById('bgMusic');
  bgMusic.volume = 1.0;

  const MafiaAudio = (() => {
    let started = false, muted = false;

    function start() {
      if (started) return;
      started = true;
      bgMusic.play().catch(() => {
        // autoplay blocked — will retry on next user gesture via unlockAudio()
        started = false;
      });
    }

    function toggleMute() {
      if (!started) { start(); return true; }
      muted = !muted;
      bgMusic.muted = muted;
      return !muted;
    }

    return { start, toggleMute };
  })();

  const soundBtn = document.getElementById('soundToggle');
  const iconOn = document.getElementById('iconSoundOn');
  const iconOff = document.getElementById('iconSoundOff');

  function requestFullscreen() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen ||
                el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) { try { req.call(el); } catch (e) {} }
    if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
      window.screen.orientation.lock('portrait').catch(() => {});
    }
  }

  function unlockAudio() {
    MafiaAudio.start();
    requestFullscreen();
    document.removeEventListener('touchstart', unlockAudio);
    document.removeEventListener('click', unlockAudioOnce);
  }
  function unlockAudioOnce() { unlockAudio(); }
  // try immediately (works on many desktop browsers); otherwise unlock on first touch
  MafiaAudio.start();
  document.addEventListener('touchstart', unlockAudio, { once: true });
  document.addEventListener('click', unlockAudioOnce, { once: true });
  window.addEventListener('load', requestFullscreen);

  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const on = MafiaAudio.toggleMute();
    iconOn.style.display = on ? 'block' : 'none';
    iconOff.style.display = on ? 'none' : 'block';
  });
</script>

</body>
</html>
